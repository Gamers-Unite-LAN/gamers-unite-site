services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/gamers-unite.sqlite
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-8388608}
      S3_BUCKET: ${S3_BUCKET:-gul-images}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - api-data:/app/data

volumes:
  api-data:
